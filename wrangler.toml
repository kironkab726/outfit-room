# Cloudflare Workers 설정
#   src/index.js  : 서버(API) 부분
#   public/       : 화면 파일 (index.html, app.js, style.css)
name = "outfit-room"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
